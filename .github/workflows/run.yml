name: Run Chronicle

on:
  workflow_dispatch

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  RAYON_NUM_THREADS: "4"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: cargo build --release
        env:
          RUSTFLAGS: "-C target-cpu=native"

      - name: Run Chronicle application
        #run: RUST_BACKTRACE=full cargo run --release -- train --out out/m1.bin --secs 1800
        run: |
          cargo run --release -- sizes --model out/m2.bin
          cargo run --release -- train --init out/m2.bin --kmax 2 --thi 16 --qhi 12 --out out/m2_q12.bin --n 1000 --esecs 30
          cargo run --release -- cmp --a out/m2.bin --b out/m2_q12.bin --axis depth
          cargo run --release -- cmp --a out/m1.bin --b out/m1_t12.bin --axis len
          cargo run --release -- cmp --a out/m1.bin --b out/m1_q6.bin --axis depth
        env:
          RUSTFLAGS: "-C target-cpu=native"

      #- name: Run test
        #run: cargo test -- --nocapture

      - name: Debug - Show files and Git status
        if: always()
        run: |
          echo "=== Files in directories ==="
          ls -la out/ || echo "Directory out/ not found!"
          echo "=== Git Status (including ignored) ==="
          git status --ignored

      - name: Commit and Push changes
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Résultats simulation: ${{ github.run_number }}"
          file_pattern: 'out/'
          add_options: '-f'