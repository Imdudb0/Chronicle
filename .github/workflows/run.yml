name: Run Chronicle

on:
  workflow_dispatch

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  RAYON_NUM_THREADS: "4"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: cargo build --release
        env:
          RUSTFLAGS: "-C target-cpu=native"

      - name: Run Chronicle application
        #run: RUST_BACKTRACE=full cargo run --release -- train --out out/m1.bin --secs 1800
        run: |
          cargo run --release -- tgrad      # doit rester ok : rho = ∞ par défaut
          cargo run --release -- train --kmax 2 --secs 5400 --out out/t3.bin --n 1000 --esecs 90
          cargo run --release -- sizes --model out/t3.bin    # seulement si l'étage 6 est atteint à fid ≥ 0,95
        env:
          RUSTFLAGS: "-C target-cpu=native"

      #- name: Run test
        #run: cargo test -- --nocapture

      - name: Debug - Show files and Git status
        if: always()
        run: |
          echo "=== Files in directories ==="
          ls -la out/ || echo "Directory out/ not found!"
          echo "=== Git Status (including ignored) ==="
          git status --ignored

      - name: Commit and Push changes
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Résultats simulation: ${{ github.run_number }}"
          file_pattern: 'out/'
          add_options: '-f'