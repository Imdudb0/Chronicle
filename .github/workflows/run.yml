name: Run Chronicle

on:
  workflow_dispatch

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  RAYON_NUM_THREADS: "4"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: cargo build --release
        env:
          RUSTFLAGS: "-C target-cpu=native"

      - name: Run Chronicle application
        #run: RUST_BACKTRACE=full cargo run --release -- train --out out/m1.bin --secs 1800
        run: |
          cargo run --release -- diag --model out/t4.bin --thi 24 --qhi 24 --n 8000
          cargo run --release -- train --kmax 2 --trunc --pool 256 --secs 5400 --out out/t4_p256.bin --n 1000 --esecs 90
          cargo run --release -- train --init out/t4_p256.bin --out out/t6.bin --pool 256 --kmax 2 --kmin 2 --trunc \
            --qtop 12 --from 5 --frontier --up 0.85 --gate 0.85 --maxcyc 3 --lr 5e-4 --secs 7200
        env:
          RUSTFLAGS: "-C target-cpu=native"

      #- name: Run test
        #run: cargo test -- --nocapture

      - name: Debug - Show files and Git status
        if: always()
        run: |
          echo "=== Files in directories ==="
          ls -la out/ || echo "Directory out/ not found!"
          echo "=== Git Status (including ignored) ==="
          git status --ignored

      - name: Commit and Push changes
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Résultats simulation: ${{ github.run_number }}"
          file_pattern: 'out/'
          add_options: '-f'